<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro - focus timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p class="eyebrow">Focus timer</p>
        <h1>Pomodoro</h1>
      </div>
      <p class="phrase">One thing at a time.</p>
    </header>

    <section id="timer-card" class="timer-card" data-phase="work">
      <div class="phase-row">
        <span id="mode" class="phase" aria-live="polite">Focus</span>
        <span class="cycle">25 / 5 cycle</span>
      </div>

      <div class="dial">
        <svg class="ring" viewBox="0 0 260 260" aria-hidden="true">
          <circle class="ring-bg" cx="130" cy="130" r="112"></circle>
          <circle id="ring-progress" class="ring-progress" cx="130" cy="130" r="112"></circle>
        </svg>
        <div class="readout">
          <span id="time" role="timer" aria-live="off">25:00</span>
          <span class="caption">remaining</span>
        </div>
      </div>

      <div class="controls">
        <button id="start" class="primary" type="button">Start</button>
        <button id="pause" class="ghost" type="button" disabled>Pause</button>
        <button id="reset" class="ghost" type="button">Reset</button>
      </div>

      <div class="session-row">
        <span class="marker" aria-hidden="true"></span>
        <span>Sessions completed</span>
        <strong id="session-count">0</strong>
      </div>
    </section>

    <p class="note">
      Focus runs for 25 minutes, then a 5 minute break is queued. Start the next
      phase when you are ready. Reset returns to a fresh focus session.
    </p>
  </main>
  <script src="app.js"></script>
</body>
</html>
